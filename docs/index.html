  <script>
    (function () {
      // 刷新后别让浏览器把页面滚回上次的位置：会和启动页收起的动作叠在一起，
      // 看起来像整页晃了一下。我们自己的路由本来就会把页面放回顶部。
      try {
        if ('scrollRestoration' in history) history.scrollRestoration = 'manual';
      } catch (err) { /* 隐私模式等场景忽略 */ }
      window.addEventListener('load', function () {
        window.scrollTo(0, 0);
      }, { once: true });

      try {
        var mode = localStorage.getItem('zrkd:theme') || 'system';
        var dark = mode === 'dark' ||
          (mode === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
        var theme = dark ? 'dark' : 'light';
        document.documentElement.dataset.theme = theme;
        document.documentElement.style.colorScheme = theme;
        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta) meta.setAttribute('content', dark ? '#14110e' : '#f4efe4');
        var stored = JSON.parse(localStorage.getItem('zrkd:accent-vars') || 'null');
        var vars = stored && (dark ? stored.dark : stored.light);
        if (vars) {
          for (var name in vars) document.documentElement.style.setProperty(name, vars[name]);
        }
      } catch (err) { /* 隐私模式下 localStorage 不可用，保持默认浅色 */ }
    })();
  </script>
