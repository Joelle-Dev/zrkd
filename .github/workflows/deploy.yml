name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: install
        run: |
          set +e
          npm ci --no-audit --no-fund --prefer-offline > /tmp/ci.log 2>&1
          code=$?
          if [ $code -ne 0 ]; then
            grep -Ei "npm error|ERR!" /tmp/ci.log | head -30 | while IFS= read -r line; do
              echo "::error::$line"
            done
            echo "--- tail ---"
            tail -40 /tmp/ci.log
          fi
          exit $code

      - name: test
        run: |
          set +e
          npm test > /tmp/test.log 2>&1
          code=$?
          if [ $code -ne 0 ]; then
            grep -E "^not ok|AssertionError|expected|actual|Error:" /tmp/test.log | head -40 | while IFS= read -r line; do
              echo "::error::$line"
            done
            echo "--- tail ---"
            tail -60 /tmp/test.log
          fi
          exit $code

      - run: npm run build

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
