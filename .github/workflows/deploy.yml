name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # GitHub 的临时 runner 上 npm 偶尔报 "Exit handler never called!"，
      # 这是 npm 自身的已知问题，重试一次即可，不掩盖真实安装错误。
      - name: install
        run: |
          for attempt in 1 2 3; do
            if npm ci --no-audit --no-fund; then
              exit 0
            fi
            echo "::warning::npm ci 第 ${attempt} 次失败，重试中"
            sleep 5
          done
          echo "::error::npm ci 连续三次失败"
          exit 1

      - name: test
        run: |
          set +e
          npm test > /tmp/test.log 2>&1
          code=$?
          if [ $code -ne 0 ]; then
            grep -E "^not ok|AssertionError|expected|actual" /tmp/test.log | head -40 | while IFS= read -r line; do
              echo "::error::$line"
            done
            echo "--- tail ---"
            tail -60 /tmp/test.log
          fi
          exit $code

      - run: npm run build

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
