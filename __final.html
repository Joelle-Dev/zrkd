<!doctype html><html lang="zh-CN"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="/src/styles/global.css"></head>
<body><div id="app"></div><pre id="out" style="position:fixed;top:0;left:0;z-index:99;font-size:9px;background:#ff0;white-space:pre-wrap">pending</pre>
<script type="module">
import { createApp, nextTick } from 'vue';
import { createRouter, createWebHashHistory } from 'vue-router';
import DiaryEditView from '/src/views/DiaryEditView.vue';
const router = createRouter({ history: createWebHashHistory(), routes: [{ path: '/', component: DiaryEditView }] });
const app = createApp(DiaryEditView); app.use(router);
await router.isReady(); app.mount('#app'); await nextTick();
const $=(s)=>document.querySelector(s);
const g=(s)=>{const e=$(s);if(!e)return null;const r=e.getBoundingClientRect();return {top:Math.round(r.top),h:Math.round(r.height)};};
const wait=(ms)=>new Promise(r=>setTimeout(r,ms));
setTimeout(async()=>{
  const res={};
  res.head=g('.write-topbar'); res.toolbar=g('.vditor-toolbar'); res.editor=g('.vditor-ir'); res.footer=g('.write-footer');
  res.mood=document.querySelectorAll('.write-mood').length;
  res.build=Boolean($('.write-build'));
  res.titleInput=Boolean($('.write-title-input'));
  res.footerText=$('.write-footer-state')?.textContent||'(空)';
  res.docOverflowX=document.documentElement.scrollWidth>innerWidth+1;
  res.firstTextTop=Math.round($('.vditor-ir').getBoundingClientRect().top);
  document.getElementById('out').textContent=JSON.stringify(res,null,1);
},3500);
setTimeout(()=>{const el=document.getElementById('out');if(el.textContent==='pending')el.textContent='TIMEOUT';},14000);
</script></body></html>
